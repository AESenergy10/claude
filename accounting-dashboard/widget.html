<title>AESENERGY Ledger</title>
<meta name="description" content="Revenue & expense dashboard for AESENERGY LLC, Jan–Aug 2026">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme: light;
  --plane:#f4f2ec; --surface:#fffdf8; --surface-2:#faf8f1; --raised:#ffffff;
  --ink:#1b1c19; --ink-2:#5b5a52; --muted:#8b8980; --hair:#e4e1d6; --hair-2:#efece3;
  --brand:#b5720b; --brand-ink:#8a5606; --brand-wash:#f6ead2;
  --pos:#0e8f5f; --pos-wash:#e0f1e7; --neg:#d6522b; --neg-wash:#f7e6dd;
  --focus:#b5720b;
  /* categorical (validated dataviz palette, light) */
  --c-blue:#2a78d6; --c-orange:#eb6834; --c-aqua:#1baf7a; --c-yellow:#eda100;
  --c-magenta:#e87ba4; --c-green:#008300; --c-violet:#4a3aa7; --c-red:#e34948;
  --c-gray:#9a978d; --c-gray2:#c2beb2;
  --seq:#2a78d6;
  --shadow:0 1px 2px rgba(27,28,25,.05),0 8px 24px -12px rgba(27,28,25,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme: dark;
  --plane:#0e0e0c; --surface:#1a1a17; --surface-2:#201f1b; --raised:#242320;
  --ink:#f5f3ea; --ink-2:#c3c1b6; --muted:#8b8980; --hair:#302f2a; --hair-2:#26251f;
  --brand:#e3a43a; --brand-ink:#e9b45c; --brand-wash:#332711;
  --pos:#2fb47e; --pos-wash:#14281f; --neg:#e8734d; --neg-wash:#2e1a12;
  --c-blue:#3987e5; --c-orange:#d95926; --c-aqua:#199e70; --c-yellow:#c98500;
  --c-magenta:#d55181; --c-green:#0a9a0a; --c-violet:#9085e9; --c-red:#e66767;
  --c-gray:#8f8c82; --c-gray2:#57554e;
  --seq:#3987e5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0e0e0c; --surface:#1a1a17; --surface-2:#201f1b; --raised:#242320;
  --ink:#f5f3ea; --ink-2:#c3c1b6; --muted:#8b8980; --hair:#302f2a; --hair-2:#26251f;
  --brand:#e3a43a; --brand-ink:#e9b45c; --brand-wash:#332711;
  --pos:#2fb47e; --pos-wash:#14281f; --neg:#e8734d; --neg-wash:#2e1a12;
  --c-blue:#3987e5; --c-orange:#d95926; --c-aqua:#199e70; --c-yellow:#c98500;
  --c-magenta:#d55181; --c-green:#0a9a0a; --c-violet:#9085e9; --c-red:#e66767;
  --c-gray:#8f8c82; --c-gray2:#57554e;
  --seq:#3987e5;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:var(--brand-ink)}
button{font-family:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--hair)}
.topin{display:flex;align-items:center;gap:16px;padding:16px 20px;max-width:1160px;margin:0 auto;flex-wrap:wrap}
.logo{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--brand),#e0a53a);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.logo svg{width:22px;height:22px}
.brandname{font-family:"Fraunces",serif;font-weight:700;font-size:19px;line-height:1.05;letter-spacing:-.02em}
.brandsub{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.acct{margin-left:auto;text-align:right;font-size:11.5px;color:var(--ink-2)}
.acct b{display:block;font-size:13px;color:var(--ink);font-weight:600}
.hbtns{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--hair);background:var(--raised);color:var(--ink);border-radius:9px;
  padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;gap:7px;align-items:center;
  transition:border-color .15s,background .15s,transform .05s}
.btn:hover{border-color:var(--brand)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#2a1c04}
.btn.primary:hover{filter:brightness(1.04)}
.iconbtn{width:38px;height:38px;justify-content:center;padding:0}

/* period line */
.period{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 0 4px}
.period .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.toggle{margin-left:auto;display:inline-flex;background:var(--surface-2);border:1px solid var(--hair);border-radius:9px;padding:3px}
.toggle button{border:0;background:transparent;color:var(--ink-2);padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.viewnote{font-size:12px;color:var(--muted);flex-basis:100%;margin-top:2px}
.months{display:flex;gap:6px;flex-basis:100%;margin-top:10px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.months button{flex:none;border:1px solid var(--hair);background:var(--surface);color:var(--ink-2);
  padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;transition:all .12s;font-family:inherit}
.months button:hover{border-color:var(--brand)}
.months button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#2a1c04}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0 4px}
.kpi{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:15px 16px;position:relative;overflow:hidden}
.kpi .lab{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:25px;font-weight:600;margin-top:8px;letter-spacing:-.02em}
.kpi .sub{font-size:12px;color:var(--ink-2);margin-top:3px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.kpi.rev{--k:var(--pos)} .kpi.exp{--k:var(--neg)} .kpi.net{--k:var(--brand)} .kpi.bal{--k:var(--c-blue)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k)}
.pos{color:var(--pos)} .neg{color:var(--neg)}

/* tabs */
.tabs{display:flex;gap:2px;margin-top:20px;border-bottom:1px solid var(--hair);overflow-x:auto}
.tab{border:0;background:transparent;color:var(--ink-2);padding:11px 15px;font-size:13.5px;font-weight:600;
  cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--brand-ink);border-bottom-color:var(--brand)}
.panel{padding:20px 0 50px}
.panel[hidden]{display:none}

/* cards & charts */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:16px 18px}
.card h3{font-size:16px}
.card .ch-sub{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.card-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
figure{margin:0}
svg .grid-l{stroke:var(--hair);stroke-width:1}
svg .base-l{stroke:var(--hair);stroke-width:1}
svg text{fill:var(--muted);font-size:11px;font-family:"IBM Plex Sans",sans-serif}
svg .axv{fill:var(--ink-2);font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin-top:12px}
.legend .item{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);cursor:default}
.legend .sw{width:11px;height:11px;border-radius:3px;flex:none}

/* insight callout */
.insight{background:var(--brand-wash);border:1px solid color-mix(in srgb,var(--brand) 30%,transparent);
  border-radius:12px;padding:13px 15px;font-size:13px;color:var(--ink);display:flex;gap:11px}
.insight svg{width:18px;height:18px;flex:none;color:var(--brand-ink);margin-top:1px}
.insight b{font-weight:600}

/* matrix table */
.tablewrap{overflow-x:auto;border:1px solid var(--hair);border-radius:12px;background:var(--surface)}
table.matrix{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
table.matrix th,table.matrix td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--hair-2);white-space:nowrap}
table.matrix thead th{position:sticky;top:0;background:var(--surface-2);color:var(--ink-2);font-weight:600;font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;z-index:1;cursor:pointer;user-select:none}
table.matrix thead th:first-child,table.matrix td.cat{text-align:left}
table.matrix td.cat{font-weight:500;position:sticky;left:0;background:var(--surface)}
table.matrix td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
table.matrix tr:hover td{background:var(--surface-2)}
table.matrix tr.total-row td{border-top:2px solid var(--hair);font-weight:700;background:var(--surface-2)}
table.matrix tr.total-row td.cat{background:var(--surface-2)}
table.matrix tr.section-row td{background:var(--surface-2);font-family:"IBM Plex Sans",sans-serif;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);padding-top:11px;padding-bottom:7px}
table.matrix tr.section-row.inc td{color:var(--pos)} table.matrix tr.section-row.exp td{color:var(--neg)}
table.matrix tr.subtotal td{font-weight:700;border-top:1px solid var(--hair);background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
table.matrix tr.net-row td{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);font-weight:700;font-size:14px;background:var(--surface-2)}
table.matrix tr.net-row td.cat{font-family:"Fraunces",serif;font-size:15px}
table.matrix td.pos{color:var(--pos)} table.matrix td.neg{color:var(--neg)}
.pnl-note{font-size:12.5px;color:var(--muted);display:flex;gap:9px;align-items:flex-start;margin-top:12px}
.pnl-note svg{width:15px;height:15px;flex:none;margin-top:1px;color:var(--muted)}
table.matrix th.msel{color:var(--brand-ink);border-bottom:2px solid var(--brand)}
table.matrix td.msel{font-weight:700;box-shadow:inset 2px 0 var(--brand),inset -2px 0 var(--brand)}
.catname{display:flex;align-items:center;gap:8px}
.tag{font-size:10px;padding:1px 6px;border-radius:20px;background:var(--surface-2);border:1px solid var(--hair);color:var(--muted);font-weight:600}
.tag.nonop{background:var(--brand-wash);border-color:transparent;color:var(--brand-ink)}
th.sorted::after{content:" ↓";color:var(--brand-ink)}
th.sorted.asc::after{content:" ↑"}

/* transactions */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input{font-family:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--hair);
  border-radius:9px;background:var(--raised);color:var(--ink)}
.filters input{flex:1;min-width:170px}
.filters .count{margin-left:auto;font-size:12.5px;color:var(--muted)}
table.txns{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
table.txns th,table.txns td{padding:9px 12px;border-bottom:1px solid var(--hair-2);text-align:left;vertical-align:top}
table.txns thead th{position:sticky;top:0;background:var(--surface-2);color:var(--ink-2);font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;font-weight:600;cursor:pointer;white-space:nowrap;z-index:1}
table.txns td.amt{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
table.txns td.desc{max-width:340px}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap;display:inline-block}
.pill.in{background:var(--pos-wash);color:var(--pos)}
.pill.out{background:var(--neg-wash);color:var(--neg)}
.catchip{font-size:11px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.txscroll{max-height:560px;overflow:auto;border:1px solid var(--hair);border-radius:12px}

/* tooltip */
#tip{position:fixed;pointer-events:none;z-index:60;background:var(--raised);border:1px solid var(--hair);
  box-shadow:var(--shadow);border-radius:9px;padding:8px 11px;font-size:12px;opacity:0;transition:opacity .1s;max-width:250px}
#tip .t-h{font-weight:600;margin-bottom:3px}
#tip .t-r{display:flex;justify-content:space-between;gap:14px;color:var(--ink-2)}
#tip .t-r b{color:var(--ink);font-family:"IBM Plex Mono",monospace}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,10,8,.5);display:none;place-items:center;z-index:50;padding:20px}
.overlay.on{display:grid}
.modal{background:var(--surface);border:1px solid var(--hair);border-radius:16px;width:min(680px,100%);max-height:88vh;
  overflow:auto;box-shadow:var(--shadow);padding:22px}
.modal h2{font-size:20px}
.modal .m-sub{color:var(--ink-2);font-size:13px;margin:4px 0 16px}
.modal .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--hair);border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
textarea{width:100%;height:230px;border:1px solid var(--hair);border-radius:10px;background:var(--surface-2);color:var(--ink);
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;padding:11px;resize:vertical}
.modal-close{position:sticky;float:right;top:0;border:0;background:transparent;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}

@media (max-width:820px){.kpis{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media (max-width:480px){.kpis{grid-template-columns:1fr}}

/* print */
@media print{
  body{background:#fff}
  .top,.tabs,.toggle,.hbtns,.filters,.txscroll{display:none!important}
  .panel[hidden]{display:block!important}
  .panel{padding:0}
  .card,.kpi,.tablewrap{break-inside:avoid;box-shadow:none}
  .no-print{display:none!important}
  h2.printonly{display:block!important}
}
.printonly{display:none}
</style>

  <div class="topin">

      <svg viewBox="0 0 24 24" fill="none" stroke="#2a1c04" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const fmtUSD = (n,dec=0)=> (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const fmtK = n=>{const a=Math.abs(n); if(a>=1000) return (n<0?'-':'')+'$'+(a/1000).toFixed(a>=10000?0:1)+'k'; return fmtUSD(n);};
const MONTHS = DATA.months;               // [{key,label,begin,end}]
const MKEYS = MONTHS.map(m=>m.key);
const MLAB = Object.fromEntries(MONTHS.map(m=>[m.key,m.label]));
const MSHORT = Object.fromEntries(MONTHS.map(m=>[m.key,m.label.split(' ')[0]]));

// txn tuple: [month, section, mmdd, kind, category, description, amount]
const TX = DATA.t.map(r=>({month:r[0],section:r[1],mmdd:r[2],kind:r[3],category:r[4],desc:r[5],amt:r[6]}));

const NONOP = new Set(['Internal Transfer In','Internal Transfer Out','Owner & Family Draws','Owner Contributions']);
let VIEW = 'all';     // 'all' | 'op'
let PERIOD = 'all';   // 'all' | month key
const included = t => VIEW==='all' ? true : !NONOP.has(t.category);
const periodMonths = () => PERIOD==='all' ? MKEYS : [PERIOD];
const periodLabelText = () => PERIOD==='all' ? `${MONTHS.length}-month overview` : `${MLAB[PERIOD]} · single month`;
// category totals over the selected period (identity-stable)
function catTotals(catMap){
  const pm=periodMonths();
  return Object.keys(catMap).map(c=>({cat:c,value:pm.reduce((a,m)=>a+(catMap[c][m]||0),0)}))
    .filter(r=>r.value>0).sort((a,b)=>b.value-a.value);
}
const catInPeriod=(catMap,cat)=>periodMonths().reduce((a,m)=>a+((catMap[cat]||{})[m]||0),0);

// fixed category -> color (identity, never rank)
const CVAR = s=>getComputedStyle(document.documentElement).getPropertyValue(s).trim();
const EXP_COLOR = {
  'Shipping & Logistics':'--c-blue','Solar & Equipment Suppliers':'--c-orange',
  'Contractor & Vendor Payments':'--c-aqua','Suppliers & Inventory':'--c-yellow',
  'Rent & Facilities':'--c-magenta','Cash Withdrawals':'--c-violet',
  'Bank Fees & Charges':'--c-red','Owner & Family Draws':'--c-gray',
  'Internal Transfer Out':'--c-gray2'
};
const REV_COLOR = {

// ---------- aggregation ----------
function agg(forceOp){
  const inc = forceOp ? (t=>!NONOP.has(t.category)) : included;
  const rev = {}, exp = {};          // month -> total
  const revCat = {}, expCat = {};    // cat -> month -> total  and cat->total
  MKEYS.forEach(m=>{rev[m]=0;exp[m]=0;});
  for(const t of TX){
    if(!inc(t)) continue;
    if(t.kind==='revenue'){ rev[t.month]+=t.amt;
      (revCat[t.category]=revCat[t.category]||{tot:0})[t.month]=(revCat[t.category][t.month]||0)+t.amt;
      revCat[t.category].tot+=t.amt;
    } else { exp[t.month]+=t.amt;
      (expCat[t.category]=expCat[t.category]||{tot:0})[t.month]=(expCat[t.category][t.month]||0)+t.amt;
      expCat[t.category].tot+=t.amt;
    }
  }
  return {rev,exp,revCat,expCat};
}
const sum = o => MKEYS.reduce((a,m)=>a+(o[m]||0),0);

// ---------- SVG helpers ----------
const SVGNS='http://www.w3.org/2000/svg';
function niceMax(v){if(v<=0)return 10;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;
  const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p;}
function svgEl(t,a){const e=document.createElementNS(SVGNS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}

// grouped bars: money in vs out per month
function groupedBars(host,forceOp){
  const {rev,exp}=agg(forceOp);

  const iw=W-P.l-P.r, ih=H-P.t-P.b;

  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',height:H});
  for(let i=0;i<=4;i++){const y=P.t+ih*i/4;
    svg.appendChild(svgEl('line',{class:'grid-l',x1:P.l,x2:W-P.r,y1:y,y2:y}));
    const tx=svgEl('text',{x:P.l-8,y:y+3,'text-anchor':'end',class:'axv'});tx.textContent=fmtK(max*(1-i/4));svg.appendChild(tx);}
  const bw=iw/MKEYS.length, pad=bw*0.18, gp=6, barW=(bw-pad*2-gp)/2;

      const h=Math.max(0,d[0]/max*ih), x=gx+j*(barW+gp), y=P.t+ih-h;

// line chart: pass series [{name,color,data:{m:v}, dashed}]
function lineChart(host,series,opts={}){
  const W=host.clientWidth||640, H=opts.h||250, P={t:16,r:14,b:34,l:52};
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  let vals=[];series.forEach(s=>MKEYS.forEach(m=>vals.push(s.data[m]||0)));
  let mn=Math.min(0,...vals), mx=Math.max(...vals);
  const rawmax=niceMax(mx), rawmin=mn<0?-niceMax(-mn):0;
  const span=rawmax-rawmin||1;
  const X=i=>P.l+ (MKEYS.length===1?iw/2:iw*i/(MKEYS.length-1));
  const Y=v=>P.t+ih-(v-rawmin)/span*ih;
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,width:'100%',height:H});
  for(let i=0;i<=4;i++){const v=rawmin+span*i/4,y=Y(v);
    svg.appendChild(svgEl('line',{class:'grid-l',x1:P.l,x2:W-P.r,y1:y,y2:y}));
    const tx=svgEl('text',{x:P.l-8,y:y+3,'text-anchor':'end',class:'axv'});tx.textContent=fmtK(v);svg.appendChild(tx);}
  if(rawmin<0){const yz=Y(0);svg.appendChild(svgEl('line',{x1:P.l,x2:W-P.r,y1:yz,y2:yz,stroke:CVAR('--muted'),'stroke-width':1}));}
  MKEYS.forEach((m,i)=>{const tx=svgEl('text',{x:X(i),y:H-14,'text-anchor':'middle'});tx.textContent=MSHORT[m];svg.appendChild(tx);});
  series.forEach(s=>{
    let dd='';MKEYS.forEach((m,i)=>{dd+=(i?'L':'M')+X(i)+' '+Y(s.data[m]||0)+' ';});
    if(opts.fill){const area=dd+`L${X(MKEYS.length-1)} ${Y(rawmin<0?0:rawmin)} L${X(0)} ${Y(rawmin<0?0:rawmin)} Z`;
      svg.appendChild(svgEl('path',{d:area,fill:s.color,'fill-opacity':.10}));}
    svg.appendChild(svgEl('path',{d:dd,fill:'none',stroke:s.color,'stroke-width':2.4,'stroke-linejoin':'round','stroke-linecap':'round','stroke-dasharray':s.dashed?'5 4':''}));
    MKEYS.forEach((m,i)=>{
      const on=m===PERIOD;
      if(on)svg.appendChild(svgEl('circle',{cx:X(i),cy:Y(s.data[m]||0),r:9,fill:s.color,'fill-opacity':.16}));
      const c=svgEl('circle',{cx:X(i),cy:Y(s.data[m]||0),r:on?6:4.5,fill:CVAR('--surface'),stroke:s.color,'stroke-width':on?3:2.4});
      c.style.cursor='pointer';
      c.addEventListener('mousemove',e=>showTip(`<div class="t-h">${MLAB[m]}</div><div class="t-r"><span>${s.name}</span><b>${fmtUSD(s.data[m]||0)}</b></div>`,e.clientX,e.clientY));
      c.addEventListener('mouseleave',hideTip);svg.appendChild(c);
    });
  });
  host.innerHTML='';host.appendChild(svg);
}

// category x month matrix table (full detail, heat-shaded)
let matrixSort={key:'tot',asc:false};
function matrixTable(host,catMap,isRev){
  const cats=Object.keys(catMap);
  const cells=[];cats.forEach(c=>MKEYS.forEach(m=>{if(catMap[c][m])cells.push(catMap[c][m]);}));
  const cmax=Math.max(...cells,1);
  cats.sort((a,b)=>{
    let va,vb;
    if(matrixSort.key==='cat'){va=a;vb=b;return matrixSort.asc?va.localeCompare(vb):vb.localeCompare(va);}
    if(matrixSort.key==='tot'){va=catMap[a].tot;vb=catMap[b].tot;}
    else{va=catMap[a][matrixSort.key]||0;vb=catMap[b][matrixSort.key]||0;}
    return matrixSort.asc?va-vb:vb-va;
  });
  const heat=v=>{if(!v)return'transparent';const t=Math.sqrt(v/cmax);
    return `color-mix(in srgb, var(--seq) ${(t*42).toFixed(1)}%, transparent)`;};
  let html=`<table class="matrix"><thead><tr>
    <th data-k="cat" class="${matrixSort.key==='cat'?'sorted '+(matrixSort.asc?'asc':''):''}">Category</th>`;
  MKEYS.forEach(m=>{html+=`<th data-k="${m}" class="${matrixSort.key===m?'sorted '+(matrixSort.asc?'asc':''):''}${m===PERIOD?' msel':''}">${MSHORT[m]}</th>`;});
  html+=`<th data-k="tot" class="${matrixSort.key==='tot'?'sorted '+(matrixSort.asc?'asc':''):''}">Total</th></tr></thead><tbody>`;
  cats.forEach(c=>{
    const isNon=NONOP.has(c);
    html+=`<tr><td class="cat"><span class="catname"><span class="sw" style="width:10px;height:10px;border-radius:3px;background:${colorOf(c,isRev)}"></span>${c}${isNon?' <span class="tag nonop">non-op</span>':''}</span></td>`;
    MKEYS.forEach(m=>{const v=catMap[c][m]||0;
      html+=`<td class="num${m===PERIOD?' msel':''}" style="background:${heat(v)}">${v?fmtUSD(v):'<span style="color:var(--muted)">–</span>'}</td>`;});
    html+=`<td class="num"><b>${fmtUSD(catMap[c].tot)}</b></td></tr>`;
  });
  // totals
  html+=`<tr class="total-row"><td class="cat">${isRev?'Total revenue':'Total expenses'}</td>`;
  let g=0;MKEYS.forEach(m=>{const s=cats.reduce((a,c)=>a+(catMap[c][m]||0),0);g+=s;html+=`<td class="num${m===PERIOD?' msel':''}">${fmtUSD(s)}</td>`;});
  html+=`<td class="num">${fmtUSD(g)}</td></tr></tbody></table>`;
  host.innerHTML=html;
  host.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{
    const k=th.dataset.k; if(matrixSort.key===k)matrixSort.asc=!matrixSort.asc;
    else{matrixSort.key=k;matrixSort.asc=(k==='cat');}
    matrixTable(host,catMap,isRev);
  }));
}

     <div class="card-hd"><div><h3>Month-to-month revenue matrix</h3><div class="ch-sub">Every source × month · click a header to sort</div></div></div>
     <div class="tablewrap" style="margin-top:12px" id="r-matrix"></div>
   </div>`;
  stackedBars(document.getElementById('r-stack'),revCat,true);
  hbars(document.getElementById('r-top'),topRows(revCat,true,7),true);
  matrixSort={key:'tot',asc:false};
  matrixTable(document.getElementById('r-matrix'),revCat,true);
}

// ---------- Real P&L (always operating) ----------
function renderPnl(){
  const {rev,exp,revCat,expCat}=agg(true);   // force-exclude MMA transfers & owner/family
  const pm=periodMonths();
  const RI=pm.reduce((a,m)=>a+(rev[m]||0),0), RE=pm.reduce((a,m)=>a+(exp[m]||0),0), NP=RI-RE;
  const margin = RI>0 ? (NP/RI*100) : 0;
  const incCats=Object.keys(revCat).sort((a,b)=>revCat[b].tot-revCat[a].tot);
  const expCats=Object.keys(expCat).sort((a,b)=>expCat[b].tot-expCat[a].tot);
  const el=document.getElementById('p-pnl');
  const scope = PERIOD==='all' ? `${MONTHS.length}-month total` : MLAB[PERIOD];
  // build statement rows
  const cell=(v,extra='')=>`<td class="num${extra}">${v?fmtUSD(v):'<span style="color:var(--muted)">–</span>'}</td>`;
  const rowFor=(cat,map,isRev)=>{
    let cells='',tot=0;
    MKEYS.forEach(m=>{const v=(map[cat]||{})[m]||0;tot+=v;cells+=cell(v,m===PERIOD?' msel':'');});
    return `<tr><td class="cat"><span class="catname"><span class="sw" style="width:9px;height:9px;border-radius:2px;background:${colorOf(cat,isRev)}"></span>${cat}</span></td>${cells}<td class="num"><b>${fmtUSD(tot)}</b></td></tr>`;
  };
  const totalRow=(label,map,cls)=>{
    let cells='',g=0;
    MKEYS.forEach(m=>{const s=Object.keys(map).reduce((a,c)=>a+((map[c][m])||0),0);g+=s;cells+=`<td class="num${m===PERIOD?' msel':''}">${fmtUSD(s)}</td>`;});
    return `<tr class="${cls}"><td class="cat">${label}</td>${cells}<td class="num">${fmtUSD(g)}</td></tr>`;
  };
  let netCells='',gNet=0;
  MKEYS.forEach(m=>{const n=(rev[m]||0)-(exp[m]||0);gNet+=n;
    netCells+=`<td class="num ${n>=0?'pos':'neg'}${m===PERIOD?' msel':''}">${fmtUSD(n)}</td>`;});
  let head=`<th>Line item</th>`+MKEYS.map(m=>`<th class="${m===PERIOD?'msel':''}" style="text-align:right">${MSHORT[m]}</th>`).join('')+`<th style="text-align:right">Total</th>`;
  const colspan=MKEYS.length+2;
  el.innerHTML=`
   <h2 class="printonly">AESENERGY LLC — Real Profit &amp; Loss (${PERIOD==='all'?MSHORT[MKEYS[0]]+'–'+MSHORT[MKEYS[MKEYS.length-1]]:MSHORT[PERIOD]} 2026)</h2>
   <div class="insight no-print" style="margin-bottom:16px">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-6"/></svg>
     <div><b>Real business P&amp;L.</b> This statement removes money that isn't true business activity — transfers to/from the linked <b>MMA</b> account, <b>owner &amp; family draws</b>, and <b>owner contributions</b> (Souadou Bah). What's left is real revenue and real operating costs. ${PERIOD==='all'?`Across ${MONTHS.length} months`:`In ${MLAB[PERIOD]}`}: <b class="pos">${fmtUSD(RI)}</b> real income − <b class="neg">${fmtUSD(RE)}</b> real expenses = <b class="${NP>=0?'pos':'neg'}">${fmtUSD(NP)}</b> net ${NP>=0?'profit':'loss'} (${margin.toFixed(1)}% margin).</div>
   </div>
   <div class="kpis" style="margin-bottom:16px">
     <div class="kpi rev"><div class="lab"><span class="dot" style="background:var(--pos)"></span>Real Income</div><div class="val">${fmtUSD(RI)}</div><div class="sub">${scope} · excl. transfers & owner</div></div>
     <div class="kpi exp"><div class="lab"><span class="dot" style="background:var(--neg)"></span>Real Expenses</div><div class="val">${fmtUSD(RE)}</div><div class="sub">${scope} · operating costs</div></div>
     <div class="kpi net"><div class="lab"><span class="dot" style="background:var(--brand)"></span>Net ${NP>=0?'Profit':'Loss'}</div><div class="val ${NP>=0?'pos':'neg'}">${fmtUSD(NP)}</div><div class="sub">${scope}</div></div>
     <div class="kpi bal"><div class="lab"><span class="dot" style="background:var(--c-blue)"></span>Profit Margin</div><div class="val ${NP>=0?'pos':'neg'}">${margin.toFixed(1)}%</div><div class="sub">net profit ÷ real income</div></div>
   </div>
   <div class="grid g2">
     <div class="card"><div class="card-hd"><div><h3>Real income vs. expenses</h3><div class="ch-sub">Operating only · by month</div></div></div><figure id="pnl-bars"></figure>
       <div class="legend"><div class="item"><span class="sw" style="background:var(--pos)"></span>Real income</div><div class="item"><span class="sw" style="background:var(--neg)"></span>Real expenses</div></div></div>
     <div class="card"><div class="card-hd"><div><h3>Net profit</h3><div class="ch-sub">Real profit / loss by month</div></div></div><figure id="pnl-net"></figure></div>
   </div>
   <div class="card" style="margin-top:16px">
     <div class="card-hd"><div><h3>Profit &amp; Loss statement</h3><div class="ch-sub">Real income and expenses by month · transfers, owner &amp; family draws removed</div></div></div>
     <div class="tablewrap" style="margin-top:12px"><table class="matrix"><thead><tr>${head}</tr></thead><tbody>
       <tr class="section-row inc"><td>Income</td><td colspan="${colspan-1}"></td></tr>
       ${incCats.map(c=>rowFor(c,revCat,true)).join('')}
       ${totalRow('Total real income',revCat,'subtotal')}
       <tr class="section-row exp"><td>Expenses</td><td colspan="${colspan-1}"></td></tr>
       ${expCats.map(c=>rowFor(c,expCat,false)).join('')}
       ${totalRow('Total real expenses',expCat,'subtotal')}
       <tr class="net-row"><td class="cat">Net profit</td>${netCells}<td class="num ${gNet>=0?'pos':'neg'}">${fmtUSD(gNet)}</td></tr>
     </tbody></table></div>
     <div class="pnl-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></svg>
       <span>Excluded as non-operating: Internal Transfer In/Out (linked MMA account), Owner &amp; Family Draws, and Owner Contributions (Souadou Bah). These still appear in the Summary, Expense and Revenue tabs under the <b>All cash flow</b> view.</span></div>
   </div>`;
  groupedBars(document.getElementById('pnl-bars'),true);
  const net={};MKEYS.forEach(m=>net[m]=(rev[m]||0)-(exp[m]||0));
  lineChart(document.getElementById('pnl-net'),[{name:'Net profit',color:CVAR('--brand'),data:net,fill:true}],{fill:true});
}

// ---------- transactions ----------
let txSort={key:'date',asc:true};
function renderTxns(){
  const el=document.getElementById('p-txns');
  const cats=[...new Set(TX.map(t=>t.category))].sort();
  el.innerHTML=`
   <div class="filters no-print">
     <select id="f-month"><option value="">All months</option>${MKEYS.map(m=>`<option value="${m}">${MLAB[m]}</option>`).join('')}</select>
     <select id="f-kind"><option value="">In &amp; out</option><option value="revenue">Money in</option><option value="expense">Money out</option></select>
     <select id="f-cat"><option value="">All categories</option>${cats.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
     <input id="f-q" type="search" placeholder="Search description…">
     <span class="count" id="f-count"></span>
   </div>
   <div class="txscroll"><table class="txns"><thead><tr>
     <th data-k="date">Date</th><th data-k="desc">Description</th><th data-k="category">Category</th>
     <th data-k="kind">Type</th><th data-k="amt" style="text-align:right">Amount</th></tr></thead>
     <tbody id="tx-body"></tbody></table></div>`;
  if(PERIOD!=='all')document.getElementById('f-month').value=PERIOD;
  ['f-month','f-kind','f-cat'].forEach(id=>document.getElementById(id).addEventListener('change',fillTx));
  document.getElementById('f-q').addEventListener('input',fillTx);
  el.querySelectorAll('th').forEach(th=>th.addEventListener('click',()=>{
    const k=th.dataset.k;if(txSort.key===k)txSort.asc=!txSort.asc;else{txSort.key=k;txSort.asc=true;}fillTx();}));
  fillTx();
}
function currentTxFilter(){
  const m=document.getElementById('f-month')?.value||'';
  const k=document.getElementById('f-kind')?.value||'';
  const c=document.getElementById('f-cat')?.value||'';
  const q=(document.getElementById('f-q')?.value||'').toLowerCase();
  return TX.filter(t=>(!m||t.month===m)&&(!k||t.kind===k)&&(!c||t.category===c)&&(!q||t.desc.toLowerCase().includes(q)));
}
function fillTx(){
  let rows=currentTxFilter();
  const dir=txSort.asc?1:-1;
  rows.sort((a,b)=>{
    let va,vb;
    if(txSort.key==='amt'){va=a.amt;vb=b.amt;}
    else if(txSort.key==='date'){va=a.month+a.mmdd;vb=b.month+b.mmdd;}
    else{va=(a[txSort.key]||'').toString();vb=(b[txSort.key]||'').toString();return dir*va.localeCompare(vb);}
    return dir*(va-vb);
  });
  const body=document.getElementById('tx-body');
  body.innerHTML=rows.map(t=>`<tr>
    <td class="mono" style="white-space:nowrap;color:var(--ink-2)">${MSHORT[t.month]} ${t.mmdd.split('/')[1]}</td>
    <td class="desc">${t.desc.replace(/</g,'&lt;')}</td>
    <td><span class="catchip"><span class="sw" style="width:9px;height:9px;border-radius:2px;background:${colorOf(t.category,t.kind==='revenue')}"></span>${t.category}</span></td>
    <td><span class="pill ${t.kind==='revenue'?'in':'out'}">${t.kind==='revenue'?'In':'Out'}</span></td>
    <td class="amt ${t.kind==='revenue'?'pos':'neg'}">${t.kind==='revenue'?'+':'−'}${fmtUSD(t.amt,2)}</td></tr>`).join('');
  const tot=rows.reduce((a,t)=>a+(t.kind==='revenue'?t.amt:-t.amt),0);
  document.getElementById('f-count').innerHTML=`${rows.length} txns · net <b class="${tot>=0?'pos':'neg'}">${fmtUSD(tot,2)}</b>`;
}

// ---------- tabs ----------
const RENDER={summary:renderSummary,trends:renderTrends,expenses:renderExpenses,revenue:renderRevenue,pnl:renderPnl,txns:renderTxns};
let activeTab='summary';
function selectTab(name){
  activeTab=name;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!=='p-'+name);
  // the Real P&L tab is always operating, so the cash-flow toggle doesn't apply there
  const tg=document.querySelector('.toggle'), nt=document.getElementById('viewNote');
  tg.style.visibility = name==='pnl'?'hidden':'';
  nt.style.display = name==='pnl'?'none':'';
  RENDER[name]();
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>selectTab(t.dataset.tab)));

// view toggle
function setView(v){VIEW=v;
  document.getElementById('viewAll').setAttribute('aria-pressed',v==='all');
  document.getElementById('viewOp').setAttribute('aria-pressed',v==='op');
  document.getElementById('viewNote').textContent = v==='all'
    ? 'Showing every dollar that moved, including transfers to/from the linked MMA account and owner/family draws.'
    : 'Excluding internal MMA transfers and owner/family draws to isolate true business revenue & expenses.';
  renderKPIs(); RENDER[activeTab]();
}
document.getElementById('viewAll').addEventListener('click',()=>setView('all'));
document.getElementById('viewOp').addEventListener('click',()=>setView('op'));

// month selector
const monthSel=document.getElementById('monthSel');
function buildMonthPills(){
  const opts=[['all','All months'],...MKEYS.map(m=>[m,MLAB[m]])];
  monthSel.innerHTML=opts.map(([k,l])=>`<button data-m="${k}" aria-pressed="${k===PERIOD}">${l}</button>`).join('');
  monthSel.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>setPeriod(b.dataset.m)));
}
function setPeriod(p){
  PERIOD=p;
  monthSel.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===p));
  document.getElementById('periodLabel').textContent=periodLabelText();
  renderKPIs(); RENDER[activeTab]();
}
buildMonthPills();

// theme toggle
document.getElementById('themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const dark=cur? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  renderKPIs();RENDER[activeTab]();
});

// ---------- extract ----------
let expWhat='tx';
const overlay=document.getElementById('overlay');
function csvEsc(s){s=(''+s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function buildCSV(){
  if(expWhat==='tx'){
    let rows=[['Month','Date','Description','Category','Type','Amount']];
    (activeTab==='txns'?currentTxFilter():TX).forEach(t=>rows.push([MLAB[t.month],t.mmdd,t.desc,t.category,t.kind==='revenue'?'Money In':'Money Out',(t.kind==='revenue'?'':'-')+t.amt.toFixed(2)]));
    return rows.map(r=>r.map(csvEsc).join(',')).join('\n');
  }
  if(expWhat==='cat'){
    const {expCat,revCat}=agg();
    let rows=[['Type','Category',...MKEYS.map(m=>MLAB[m]),'Total']];
    const add=(map,typ)=>Object.keys(map).sort((a,b)=>map[b].tot-map[a].tot).forEach(c=>
      rows.push([typ,c,...MKEYS.map(m=>(map[c][m]||0).toFixed(2)),map[c].tot.toFixed(2)]));
    add(revCat,'Revenue');add(expCat,'Expense');
    return rows.map(r=>r.map(csvEsc).join(',')).join('\n');
  }
  const {rev,exp}=agg();
  let rows=[['Month','Money In','Money Out','Net','Ending Balance']];
  MONTHS.forEach(m=>rows.push([m.label,rev[m.key].toFixed(2),exp[m.key].toFixed(2),(rev[m.key]-exp[m.key]).toFixed(2),m.end.toFixed(2)]));
  rows.push(['TOTAL',sum(rev).toFixed(2),sum(exp).toFixed(2),(sum(rev)-sum(exp)).toFixed(2),'']);
  return rows.map(r=>r.map(csvEsc).join(',')).join('\n');
}
function refreshCSV(){document.getElementById('csvOut').value=buildCSV();}
document.getElementById('extractBtn').addEventListener('click',()=>{overlay.classList.add('on');refreshCSV();});
document.getElementById('modalClose').addEventListener('click',()=>overlay.classList.remove('on'));
overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('on');});
[['expTx','tx'],['expCat','cat'],['expMon','mon']].forEach(([id,v])=>document.getElementById(id).addEventListener('click',()=>{
  expWhat=v;['expTx','expCat','expMon'].forEach(x=>document.getElementById(x).setAttribute('aria-pressed',x===id));refreshCSV();}));
document.getElementById('copyBtn').addEventListener('click',async()=>{
  const ta=document.getElementById('csvOut');
  try{await navigator.clipboard.writeText(ta.value);const b=document.getElementById('copyBtn');b.textContent='Copied ✓';setTimeout(()=>b.textContent='Copy to clipboard',1600);}
  catch(e){ta.select();document.execCommand('copy');}
});
document.getElementById('printBtn').addEventListener('click',()=>{overlay.classList.remove('on');selectTab('summary');setTimeout(()=>window.print(),120);});
document.addEventListener('keydown',e=>{if(e.key==='Escape')overlay.classList.remove('on');});

// init
setView('all');
selectTab('summary');
addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>RENDER[activeTab](),160);});
</script>
